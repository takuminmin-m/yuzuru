# CIFAR-10 チュートリアル用の yuzuru 設定（GPU 1 枚 + CPU、モデル 1 つ）。
# ~/.config/yuzuru/config.yaml にコピーし、GPU-xxxx とモデル名を自分の環境に合わせて書き換える。

resources:
  # 学習にも LLM にも使ってよい GPU。index ではなく UUID で書く（`nvidia-smi -L`）。
  # nvidia-smi と CUDA は GPU の番号の付け方が違うことがある
  gpus: ["GPU-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"]

ollama:
  manage: true           # 上の GPU だけが見える専用の ollama serve を yuzuru が起動する
  env:
    OLLAMA_VULKAN: "0"   # Vulkan バックエンドは CUDA_VISIBLE_DEVICES を無視して他の GPU を見つけてしまう

router:
  classifier: heuristic  # モデルが 1 つなので難易度判定は不要

tiers:
  - name: large
    models: ["qwen3.6-iq3:latest"]   # `ollama list` の名前。ツール呼び出しができるモデルにする
    num_ctx: 65536                   # エージェントは 1 ターンで 2〜3 万トークン使う。32k 以上を推奨
    max_cpu_fraction: 0.7            # VRAM に入りきらない分はこの割合まで RAM に逃がしてよい

lease:
  settle_seconds: 6      # vram を指定しなかった学習は、VRAM 使用量がこの秒数安定した時点の量で予約する

isolation:
  memory_max: 80%        # エージェントと学習ジョブ 1 つあたりの RAM 上限。超えたプロセスだけが殺される

resume:
  # 自動で再開したターンの出力をファイルに残す。既定（opencode run --session {session} {message}）は
  # 出力を捨てるので、見たいならこの形にする
  command: ["bash", "-c", 'opencode run --session "$0" "$1" >> "$HOME/.local/state/yuzuru/resume.log" 2>&1',
            "{session}", "{message}"]
